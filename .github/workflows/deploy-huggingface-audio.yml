name: Deploy Hugging Face Audio Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/audio-analysis/**"
      - ".github/workflows/deploy-huggingface-audio.yml"

concurrency:
  group: melodyvision-huggingface-audio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Space repository
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/melodyvision-audio-space"
          cp -R services/audio-analysis/. "$RUNNER_TEMP/melodyvision-audio-space/"
          rm -rf "$RUNNER_TEMP/melodyvision-audio-space/.venv" \
            "$RUNNER_TEMP/melodyvision-audio-space/.cache" \
            "$RUNNER_TEMP/melodyvision-audio-space/results"

      - name: Push to Hugging Face Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_SPACE_REPO"
          cd "$RUNNER_TEMP/melodyvision-audio-space"
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy MelodyVision audio analysis"
          git remote add origin "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git push --force origin main
