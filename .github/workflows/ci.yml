name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_API_KEY: ci-placeholder
      LLM_BASE_URL: http://127.0.0.1:9/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

  python:
    name: Python audio validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            services/audio-analysis/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            fastapi==0.139.0 \
            python-multipart==0.0.32

      - name: Run audio-analysis tests
        working-directory: services/audio-analysis
        env:
          CLAP_DISABLED: "1"
          CLAP_PRELOAD: "0"
          NUMBA_CACHE_DIR: /tmp/melodyvision-numba
        run: python -m unittest discover -s tests -v

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: melodyvision_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d melodyvision_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: melodyvision_ci
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create Supabase storage stubs
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists storage;
          create table storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table storage.objects (
            id bigint generated always as identity primary key,
            bucket_id text not null
          );
          alter table storage.objects enable row level security;
          SQL

      - name: Apply Supabase migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done

      - name: Verify migrated schema
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.generation_runs') is null
              or to_regclass('public.audio_analyses') is null
              or to_regclass('public.labeled_comparisons') is null
              or to_regclass('public.manipulation_checks') is null then
              raise exception 'Expected MelodyVision tables were not created';
            end if;

            if not exists (
              select 1
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'study_trials'
                and column_name = 'protocol_version'
            ) then
              raise exception 'study_trials.protocol_version is missing';
            end if;

            if not exists (
              select 1
              from storage.buckets
              where id = 'generated'
            ) or not exists (
              select 1
              from storage.buckets
              where id = 'audio-analysis'
            ) then
              raise exception 'Expected storage buckets were not configured';
            end if;
          end
          $$;
          SQL
